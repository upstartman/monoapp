<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マンガ管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#6366f1;--accent:#f472b6;--gold:#fbbf24;--bg-dark:#0f0f1a;--bg-card:rgba(255,255,255,0.03);--text-primary:#fff;--text-secondary:rgba(255,255,255,0.6);--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);--own:#22d3ee;--done:#34d399;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;font-size:16px;line-height:1.5;}
.bg-animation{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 80%,rgba(99,102,241,0.15) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(244,114,182,0.12) 0%,transparent 50%);}
.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:9px 14px;background:rgba(15,15,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);}
.header-inner{max-width:640px;margin:0 auto;}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-icon{position:relative;width:30px;height:30px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.logo-text{font-size:16px;font-weight:700;}
.header-btns{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:#fff;position:relative;}
.icon-btn.add{background:linear-gradient(135deg,var(--primary),var(--accent));border:none;font-size:24px;font-weight:700;}
.sync-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:#22c55e;border-radius:50%;border:2px solid var(--bg-dark);}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite;}
.sync-dot.error{background:#ef4444;}
.search-wrap{position:relative;margin-top:8px;}
.search-wrap input{width:100%;padding:9px 38px 9px 38px;background:var(--glass);border:1px solid var(--glass-border);border-radius:11px;color:#fff;font-size:15px;font-family:inherit;}
.search-wrap input:focus{outline:none;border-color:var(--primary);}
.search-wrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;}
.search-wrap .sc{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:transparent;color:var(--text-secondary);font-size:18px;cursor:pointer;display:none;}
.tabs{display:flex;gap:8px;margin-top:8px;}
.tab{flex:1;padding:7px 6px;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;text-align:center;}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
.tab .cnt{font-size:11px;opacity:.8;margin-left:4px;}
.main{padding:150px 12px 60px;max-width:640px;margin:0 auto;}
.stats{font-size:11px;color:var(--text-secondary);margin-bottom:10px;text-align:center;}
.group-head{display:flex;align-items:center;gap:8px;margin:14px 0 7px;}
.group-head:first-child{margin-top:0;}
.group-head .g{font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;color:var(--accent);background:var(--glass);border:1px solid var(--glass-border);padding:1px 10px;border-radius:20px;}
.group-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--glass-border),transparent);}
.card{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:10px;padding:5px 8px 5px 6px;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.fav-star{flex-shrink:0;width:26px;height:26px;border:none;background:transparent;color:var(--text-secondary);font-size:19px;cursor:pointer;padding:0;line-height:1;}
.fav-star.on{color:var(--gold);}
.ttl{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{flex-shrink:0;font-size:12px;line-height:1;}
.vol{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;}
.vol .lbl{font-size:11px;color:var(--text-secondary);line-height:1;}
.vol .lbl.buy{color:var(--own);}
.stepper{display:inline-flex;align-items:center;background:var(--glass);border:1px solid var(--glass-border);border-radius:7px;overflow:hidden;}
.stepper button{width:24px;height:26px;border:none;background:transparent;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stepper button:active{background:var(--glass);}
.stepper .num{min-width:24px;text-align:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;}
.stepper .num.buy{color:var(--own);}
.edit-btn{flex-shrink:0;width:28px;height:28px;border-radius:7px;border:1px solid var(--glass-border);background:var(--glass);cursor:pointer;font-size:14px;color:#fff;padding:0;}
.empty{text-align:center;padding:70px 20px;color:var(--text-secondary);}
.empty .ei{font-size:52px;margin-bottom:14px;}
.empty h2{font-size:17px;color:#fff;margin-bottom:6px;}
.empty p{font-size:13px;}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.modal-content{background:#1a1a2e;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border:1px solid var(--glass-border);}
@media(min-width:641px){.modal{align-items:center;}.modal-content{border-radius:20px;}}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1a1a2e;z-index:1;}
.modal-header h2{font-size:17px;font-weight:700;}
.modal-close{width:34px;height:34px;background:var(--glass);border:none;border-radius:9px;color:#fff;font-size:20px;cursor:pointer;}
.modal-body{padding:20px;}
.fg{margin-bottom:18px;}
.fg label{display:block;font-size:13px;font-weight:500;margin-bottom:7px;color:var(--text-secondary);}
.fg input[type=text],.fg input[type=number]{width:100%;padding:13px 15px;background:var(--glass);border:1px solid var(--glass-border);border-radius:11px;color:#fff;font-size:15px;font-family:inherit;}
.fg input:focus{outline:none;border-color:var(--primary);}
.hint{font-size:11px;color:var(--text-secondary);margin-top:6px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--glass);border:1px solid var(--glass-border);border-radius:11px;margin-bottom:12px;cursor:pointer;}
.toggle-row .tl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;}
.toggle-row .tl .em{font-size:20px;}
.sw{width:48px;height:28px;border-radius:20px;background:rgba(255,255,255,0.15);position:relative;transition:.2s;flex-shrink:0;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;}
.toggle-row.on .sw{background:linear-gradient(135deg,var(--primary),var(--accent));}
.toggle-row.on .sw::after{left:23px;}
.buy-field{display:none;}
.buy-field.show{display:block;}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
.btn-danger{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.35);margin-top:10px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a2e;border:1px solid var(--glass-border);padding:13px 22px;border-radius:12px;font-size:14px;z-index:300;transition:.3s;opacity:0;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.error{border-color:rgba(239,68,68,0.5);}
.loading{position:fixed;inset:0;background:var(--bg-dark);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:44px;height:44px;border:4px solid var(--glass-border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
</style>
</head>
<body>
<div class="bg-animation"></div>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">📚<span class="sync-dot" id="syncDot"></span></div>
        <div class="logo-text">マンガ管理</div>
      </div>
      <div class="header-btns">
        <div class="icon-btn add" id="addBtn">＋</div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="si">🔍</span>
      <input type="text" id="search" placeholder="タイトル・よみがなで検索">
      <button class="sc" id="searchClear">×</button>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">すべて<span class="cnt" id="cntAll"></span></div>
      <div class="tab" data-filter="own">購入<span class="cnt" id="cntOwn"></span></div>
      <div class="tab" data-filter="fav">お気に入り<span class="cnt" id="cntFav"></span></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<!-- 追加/編集モーダル -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">マンガを追加</h2>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label>タイトル</label>
        <input type="text" id="fTitle" placeholder="例：ワンピース">
      </div>
      <div class="fg">
        <label>よみがな（あいうえお順の並べ替えに使用）</label>
        <input type="text" id="fYomi" placeholder="例：わんぴーす">
        <div class="hint">ひらがなで入力してください。空欄の場合はタイトルで並べ替えます。</div>
      </div>
      <div class="fg">
        <label>読んでいる巻数</label>
        <input type="number" id="fRead" min="0" value="0" inputmode="numeric">
      </div>
      <div class="toggle-row" id="tgOwn">
        <div class="tl"><span class="em">🛒</span>購入している</div>
        <div class="sw"></div>
      </div>
      <div class="fg buy-field" id="buyField">
        <label>買っている巻数</label>
        <input type="number" id="fBought" min="0" value="0" inputmode="numeric">
      </div>
      <div class="toggle-row" id="tgFav">
        <div class="tl"><span class="em">⭐</span>お気に入り</div>
        <div class="sw"></div>
      </div>
      <div class="toggle-row" id="tgDone">
        <div class="tl"><span class="em">🏁</span>完結済み</div>
        <div class="sw"></div>
      </div>
      <button class="btn btn-primary" id="saveBtn">保存</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">削除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div><div style="color:var(--text-secondary);font-size:14px;">読み込み中...</div></div>

// ===== 状態 =====
let mangaList = [];
let currentFilter = 'all';
let searchQuery = '';
let editId = null;
let unsubscribe = null;
let saveTimer = null;

// ===== ユーティリティ =====
function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// カタカナ→ひらがな変換（検索・並べ替えの正規化用）
function toHira(s){
    return String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
function sortKey(item){ return toHira(item.yomi || item.title).normalize('NFKC'); }
// 五十音の行ラベルを返す
function gyoLabel(item){
    const c = sortKey(item)[0] || '';
    const map = [
        ['あ','あいうえおぁぃぅぇぉ'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],
        ['た','たちつてとだぢづでどっ'],['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],
        ['ま','まみむめも'],['や','やゆよゃゅょ'],['ら','らりるれろ'],['わ','わをん']
    ];
    for(const [label,set] of map){ if(set.indexOf(c)>=0) return label+'行'; }
    return 'その他';
}

// ===== 同期 =====
function setSync(status){
    const dot = document.getElementById('syncDot');
    dot.className = 'sync-dot' + (status==='syncing'?' syncing':status==='error'?' error':'');
}
function startSync(){
    unsubscribe = DOC.onSnapshot(doc=>{
        if(doc.exists && Array.isArray(doc.data().data)){
            mangaList = doc.data().data.map(x=>({favorite:false,finished:false,owned:false,bought:0,read:0,yomi:'',...x, id:x.id||uid()}));
        } else {
            // 初回：シードデータで初期化
            mangaList = SEED.map(x=>({...x, id:uid()}));
            saveNow();
        }
        render();
        document.getElementById('loading').style.display='none';
        setSync('synced');
    }, err=>{
        console.error('Firestore error:', err);
        setSync('error');
        toast('同期エラー：ローカル表示中', true);
        if(mangaList.length===0){ mangaList = SEED.map(x=>({...x, id:uid()})); render(); }
        document.getElementById('loading').style.display='none';
    });
}
async function saveNow(){
    setSync('syncing');
    try{
        await DOC.set({ data: mangaList, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        setSync('synced');
    }catch(e){
        console.error('Save error:', e);
        setSync('error');
        toast('保存エラー', true);
    }
}
// 連続操作をまとめて保存
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); render(); }

// ===== 描画 =====
function filtered(){
    const q = toHira(searchQuery.trim().toLowerCase());
    return mangaList.filter(item=>{
        if(currentFilter==='own' && !item.owned) return false;
        if(currentFilter==='fav' && !item.favorite) return false;
        if(q){
            const hay = toHira((item.title+' '+(item.yomi||'')).toLowerCase());
            if(hay.indexOf(q)<0) return false;
        }
        return true;
    }).sort((a,b)=> sortKey(a).localeCompare(sortKey(b),'ja'));
}
function render(){
    // タブのカウント
    document.getElementById('cntAll').textContent = mangaList.length;
    document.getElementById('cntOwn').textContent = mangaList.filter(x=>x.owned).length;
    document.getElementById('cntFav').textContent = mangaList.filter(x=>x.favorite).length;

    const items = filtered();
    const stats = document.getElementById('stats');
    const list = document.getElementById('list');

    if(items.length===0){
        stats.textContent='';
        list.innerHTML = `<div class="empty"><div class="ei">${searchQuery?'🔍':'📚'}</div><h2>${searchQuery?'見つかりませんでした':'まだ登録がありません'}</h2><p>${searchQuery?'別のキーワードでお試しください':'右上の＋から追加できます'}</p></div>`;
        return;
    }
    stats.textContent = `${items.length}件 表示中`;

    let html='', lastGyo=null;
    for(const item of items){
        const g = gyoLabel(item);
        if(g!==lastGyo){ html += `<div class="group-head"><span class="g">${g}</span><span class="line"></span></div>`; lastGyo=g; }
        html += cardHtml(item);
    }
    list.innerHTML = html;
}
function cardHtml(item){
    const badgeHtml = item.finished ? '<span class="badge">🏁</span>' : '';
    const buyHtml = item.owned ? `<span class="vol"><span class="lbl buy">🛒</span><span class="stepper"><button onclick="stepBought('${item.id}',-1)">−</button><span class="num buy">${item.bought}</span><button onclick="stepBought('${item.id}',1)">＋</button></span></span>` : '';
    return `<div class="card">
        <button class="fav-star ${item.favorite?'on':''}" onclick="toggleFav('${item.id}')">${item.favorite?'★':'☆'}</button>
        <span class="ttl" title="${escapeHtml(item.title)}" onclick="openEdit('${item.id}')">${escapeHtml(item.title)}</span>
        ${badgeHtml}
        <span class="vol"><span class="lbl">読</span><span class="stepper"><button onclick="stepRead('${item.id}',-1)">−</button><span class="num">${item.read}</span><button onclick="stepRead('${item.id}',1)">＋</button></span></span>
        ${buyHtml}
        <button class="edit-btn" onclick="openEdit('${item.id}')">✏️</button>
    </div>`;
}

// ===== 操作 =====
function find(id){ return mangaList.find(x=>x.id===id); }
function stepRead(id,d){ const it=find(id); if(!it)return; it.read=Math.max(0,(it.read||0)+d); if(it.owned&&it.bought<it.read) it.bought=it.read; save(); }
function stepBought(id,d){ const it=find(id); if(!it)return; it.bought=Math.max(0,(it.bought||0)+d); save(); }
function toggleFav(id){ const it=find(id); if(!it)return; it.favorite=!it.favorite; save(); }

// ===== モーダル =====
function setToggle(el,on){ el.classList.toggle('on',!!on); }
function openAdd(){
    editId=null;
    document.getElementById('modalTitle').textContent='マンガを追加';
    document.getElementById('fTitle').value='';
    document.getElementById('fYomi').value='';
    document.getElementById('fRead').value='0';
    document.getElementById('fBought').value='0';
    setToggle(document.getElementById('tgOwn'),false);
    setToggle(document.getElementById('tgFav'),false);
    setToggle(document.getElementById('tgDone'),false);
    document.getElementById('buyField').classList.remove('show');
    document.getElementById('deleteBtn').style.display='none';
    document.getElementById('modal').classList.add('open');
    setTimeout(()=>document.getElementById('fTitle').focus(),100);
}
function openEdit(id){
    const it=find(id); if(!it)return;
    editId=id;
    document.getElementById('modalTitle').textContent='編集';
    document.getElementById('fTitle').value=it.title;
    document.getElementById('fYomi').value=it.yomi||'';
    document.getElementById('fRead').value=it.read||0;
    document.getElementById('fBought').value=it.bought||0;
    setToggle(document.getElementById('tgOwn'),it.owned);
    setToggle(document.getElementById('tgFav'),it.favorite);
    setToggle(document.getElementById('tgDone'),it.finished);
    document.getElementById('buyField').classList.toggle('show',it.owned);
    document.getElementById('deleteBtn').style.display='block';
    document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function saveModal(){
    const title=document.getElementById('fTitle').value.trim();
    if(!title){ toast('タイトルを入力してください',true); return; }
    const owned=document.getElementById('tgOwn').classList.contains('on');
    const read=Math.max(0,parseInt(document.getElementById('fRead').value)||0);
    let bought=Math.max(0,parseInt(document.getElementById('fBought').value)||0);
    if(owned && bought<read) bought=read;
    const data={
        title,
        yomi:document.getElementById('fYomi').value.trim(),
        read, owned,
        bought: owned?bought:0,
        favorite:document.getElementById('tgFav').classList.contains('on'),
        finished:document.getElementById('tgDone').classList.contains('on')
    };
    if(editId){ Object.assign(find(editId), data); toast('更新しました'); }
    else { mangaList.push({id:uid(),...data}); toast('追加しました'); }
    closeModal();
    save();
}
function deleteCurrent(){
    if(!editId) return;
    const it=find(editId);
    if(!confirm(`「${it?it.title:''}」を削除しますか？`)) return;
    mangaList = mangaList.filter(x=>x.id!==editId);
    closeModal();
    toast('削除しました');
    save();
}

// ===== Toast =====
function toast(msg,isErr){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.className='toast show'+(isErr?' error':'');
    setTimeout(()=>t.classList.remove('show'),2500);
}

// ===== イベント =====
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('saveBtn').onclick=saveModal;
document.getElementById('deleteBtn').onclick=deleteCurrent;
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('tgOwn').onclick=function(){
    this.classList.toggle('on');
    document.getElementById('buyField').classList.toggle('show',this.classList.contains('on'));
};
document.getElementById('tgFav').onclick=function(){ this.classList.toggle('on'); };
document.getElementById('tgDone').onclick=function(){ this.classList.toggle('on'); };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentFilter=t.dataset.filter;
    render();
});
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{
    searchQuery=searchEl.value;
    document.getElementById('searchClear').style.display=searchQuery?'block':'none';
    render();
});
document.getElementById('searchClear').onclick=()=>{
    searchEl.value=''; searchQuery=''; document.getElementById('searchClear').style.display='none'; render(); searchEl.focus();
};

// ===== 起動 =====
startSync();
</script>
</body>
</html>
