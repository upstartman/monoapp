<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1226" />
<title>ふるさと納税管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ui: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-display: 'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --bg-1: #0f1226;
    --card: rgba(255,255,255,0.06);
    --card-strong: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.10);
    --text: #f3f4ff;
    --text-dim: #a8accc;
    --accent: #7c9cff;
    --good: #4cd6a0;
    --warn: #ffc857;
    --bad: #ff6b6b;
    --gradient: linear-gradient(135deg, #ff9a62 0%, #ffc857 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.55;
    background: radial-gradient(1200px 800px at 20% -10%, #3a2d4a 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 110%, #4a3a2d 0%, transparent 60%),
                var(--bg-1);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 12px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .container { max-width: 720px; margin: 0 auto; }

  /* ===== ヘッダー ===== */
  header.app {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 14px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-size: 20px; font-weight: 700; letter-spacing: -.01em;
  }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--gradient);
    display: grid; place-items: center;
    font-size: 17px;
    box-shadow: 0 6px 20px rgba(255,154,98,.4);
  }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .year-select, .icon-button {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; outline: none;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .year-select:focus, .icon-button:focus-visible { border-color: var(--accent); }
  .user-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 999px;
    padding: 5px 12px; font-size: 13px;
  }
  .user-chip .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--gradient); color: #0f1226;
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }

  /* ===== ボタン ===== */
  .btn {
    appearance: none; border: none; cursor: pointer;
    padding: 13px 20px; border-radius: 12px;
    font-family: inherit;
    font-size: 15px; font-weight: 700; letter-spacing: .01em;
    transition: transform .08s ease, box-shadow .2s ease, background .2s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--gradient); color: #2a1a05;
    box-shadow: 0 8px 24px rgba(255,154,98,.32);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary {
    background: var(--card-strong); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: rgba(255,255,255,.12); }
  .btn-danger { background: rgba(255,107,107,.18); color: var(--bad); border: 1px solid rgba(255,107,107,.3); }
  .btn-danger:hover { background: rgba(255,107,107,.28); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px dashed var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-block { display: block; width: 100%; }
  /* 追加ボタンは枠カードの直下・リストの上に固定 */
  .btn-add { margin-bottom: 12px; }

  /* ===== サインインカード ===== */
  .signin-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 24px; text-align: center;
    backdrop-filter: blur(12px);
  }
  .signin-card p { color: var(--text-dim); margin-bottom: 18px; font-size: 15px; line-height: 1.6; }

  /* ===== スタッツ ===== */
  .stats { display: grid; gap: 10px; margin-bottom: 14px; }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(8px);
  }
  .stat .label { font-size: 14px; color: var(--text-dim); font-weight: 600; }
  .stat .value {
    font-family: var(--font-mono);
    font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .stat-limit .value-edit {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-dim); font-size: 15px;
  }
  .stat-limit input {
    background: transparent; border: none; outline: none;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 16px; font-weight: 600;
    text-align: right; font-variant-numeric: tabular-nums;
    width: 120px; padding: 4px 6px; border-bottom: 1px dashed transparent;
    transition: border-color .2s;
  }
  .stat-limit input:hover { border-bottom-color: var(--border); }
  .stat-limit input:focus { border-bottom-color: var(--accent); color: var(--text); }
  .stat-remain {
    background: linear-gradient(135deg, rgba(76,214,160,.18) 0%, rgba(255,200,87,.12) 100%);
    border: 1px solid rgba(76,214,160,.28);
    padding: 22px 24px;
    display: block;
  }
  .stat-remain .remain-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .stat-remain .label {
    font-family: var(--font-display);
    font-size: 14px; color: var(--good); text-transform: uppercase;
    letter-spacing: .14em; font-weight: 600;
  }
  .stat-remain .value {
    font-family: var(--font-mono);
    font-size: 40px; font-weight: 800; color: var(--good);
    letter-spacing: -.02em;
    text-shadow: 0 2px 24px rgba(76,214,160,.3);
  }
  .stat-remain .sub {
    margin-top: 8px; font-size: 13px; color: var(--text-dim);
    display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .stat-remain .sub b {
    color: var(--text); font-family: var(--font-mono);
    font-weight: 700; margin-left: 4px;
  }
  .stat-remain.negative {
    background: linear-gradient(135deg, rgba(255,107,107,.18) 0%, rgba(255,200,87,.12) 100%);
    border-color: rgba(255,107,107,.32);
  }
  .stat-remain.negative .label, .stat-remain.negative .value { color: var(--bad); }
  .bar {
    margin-top: 10px; height: 7px; border-radius: 999px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--gradient); transition: width .3s ease; }
  .bar > i.over { background: linear-gradient(135deg, #ff6b6b 0%, #ffc857 100%); }

  /* ===== フィルタ ===== */
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    appearance: none; cursor: pointer; font-family: inherit;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 700;
    transition: all .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--card-strong); color: var(--text); border-color: var(--accent); }
  .chip .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-left: 5px; }

  /* ===== リスト ===== */
  .list {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px;
    backdrop-filter: blur(8px); margin-bottom: 12px;
  }
  .item {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; padding: 14px;
    border-radius: 10px; align-items: center;
    transition: background .15s;
  }
  .item + .item { border-top: 1px solid var(--border); }
  .item:hover { background: rgba(255,255,255,.04); }
  .item .main { min-width: 0; }
  .item .row1 { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .item .name { font-size: 16px; font-weight: 700; }
  .item .amount {
    font-family: var(--font-mono);
    font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .item .amount.undecided { font-size: 14px; font-weight: 600; color: var(--text-dim); }
  .item .row2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--text-dim); }
  .item .ship {
    font-family: var(--font-mono); font-size: 13px;
    background: rgba(124,156,255,.14); border: 1px solid rgba(124,156,255,.25);
    color: var(--text); padding: 3px 10px; border-radius: 999px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .item .ship.none { background: rgba(255,255,255,.04); border-style: dashed; color: var(--text-dim); font-weight: 500; }
  .item .note { font-style: italic; font-size: 13px; }
  .item .actions { display: flex; gap: 5px; align-items: center; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); width: 36px; height: 36px;
    border-radius: 9px; cursor: pointer; display: grid; place-items: center;
    transition: all .15s; font-size: 15px;
  }
  .icon-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .icon-btn.danger:hover { background: rgba(255,107,107,.15); color: var(--bad); border-color: rgba(255,107,107,.4); }

  /* ステータス / ワンストップ */
  .pill {
    appearance: none; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: var(--text-dim);
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .02em;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .pill:hover { filter: brightness(1.15); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.s-ordered { background: rgba(255,200,87,.16); color: var(--warn); border-color: rgba(255,200,87,.35); }
  .pill.s-arrived { background: rgba(76,214,160,.18); color: var(--good); border-color: rgba(76,214,160,.35); }
  .pill.onestop-on { background: rgba(124,156,255,.18); color: #a8c0ff; border-color: rgba(124,156,255,.35); }

  .receipt-thumb {
    width: 40px; height: 40px; border-radius: 9px; object-fit: cover;
    cursor: pointer; border: 1px solid var(--border);
  }
  .receipt-empty {
    width: 40px; height: 40px; border-radius: 9px;
    background: rgba(255,255,255,.03); border: 1px dashed var(--border);
    display: grid; place-items: center; color: var(--text-dim); font-size: 16px;
  }
  .empty { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: 14px; }

  /* ===== 発送時期の内訳 ===== */
  .section-title {
    font-family: var(--font-display);
    font-size: 15px; color: var(--text); font-weight: 600;
    letter-spacing: .04em; margin: 26px 0 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ship-row {
    display: grid; grid-template-columns: 100px 1fr auto auto;
    gap: 10px; padding: 11px 14px; align-items: center; font-size: 14px;
    border-radius: 10px;
  }
  .ship-row + .ship-row { border-top: 1px solid var(--border); }
  .ship-row .m { font-family: var(--font-mono); font-weight: 700; }
  .ship-row .names { color: var(--text-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ship-row .n { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .ship-row .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ===== モーダル ===== */
  .modal { display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
    padding: 12px; align-items: flex-end; justify-content: center;
  }
  .modal.show { display: flex; }
  @media (min-width: 600px) { .modal { align-items: center; } }
  .modal-content {
    background: linear-gradient(180deg, #1f1b30 0%, #17152a 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%; max-width: 560px;
    max-height: calc(100vh - 24px); overflow-y: auto;
    padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px);} to { opacity: 1; transform: translateY(0);} }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-header h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
  .close-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px;
    font-size: 15px; font-family: inherit;
  }
  .field input[type="number"] { font-family: var(--font-mono); font-weight: 600; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field input[type="file"] { padding: 8px; border-style: dashed; border-color: var(--accent); background: rgba(255,200,87,.06); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-hint { margin-top: 6px; font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .field-hint b { color: var(--text); font-family: var(--font-mono); font-weight: 700; margin-left: 4px; }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
    cursor: pointer;
  }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .check-row span { font-size: 14px; }
  .check-row small { display: block; color: var(--text-dim); font-size: 12px; }
  .image-preview {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px; margin-top: 8px; background: rgba(255,255,255,.03);
  }
  .image-preview img { max-width: 100%; max-height: 200px; border-radius: 6px; display: block; margin: 0 auto; }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="container">
  <header class="app">
    <div class="brand">
      <div class="logo">🎁</div>
      ふるさと納税
    </div>
    <div class="header-right">
      <select id="yearSelect" class="year-select"></select>
      <span id="userChip" class="user-chip hidden"><span class="avatar" id="userAvatar">?</span><span id="userName"></span></span>
      <button id="loginBtn" class="icon-button">ログイン</button>
      <button id="logoutBtn" class="icon-button hidden">↩</button>
    </div>
  </header>

  <div id="signinNotice" class="signin-card">
    <p>Googleでログインすると、ふるさと納税の申込を年度別に管理できます。<br />Wel-fit管理アプリと同じアカウントでログインできます。</p>
    <button id="loginBtn2" class="btn btn-primary btn-block">Googleでログイン</button>
  </div>

  <main id="appBody" class="hidden">
    <div class="stats">
      <div class="stat stat-remain" id="remainCard">
        <div class="remain-top">
          <span class="label">残り枠</span>
          <span class="value" id="remainValue">¥240,000</span>
        </div>
        <div class="bar"><i id="usedBar" style="width:0%"></i></div>
        <div class="sub">
          <span>申込済合計<b id="usedValue">¥0</b></span>
          <span id="planWrap" class="hidden">検討中<b id="planValue">¥0</b></span>
          <span id="planRemainWrap" class="hidden">検討中込みの残り<b id="planRemainValue">¥0</b></span>
        </div>
      </div>
      <div class="stat stat-limit">
        <span class="label">寄附上限額</span>
        <span class="value-edit">
          <input type="number" id="limitInput" min="0" step="1000" />
          <span>円</span>
        </span>
      </div>
    </div>

    <button id="addItem" class="btn btn-primary btn-block btn-add">+ 品物を追加</button>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">すべて<span class="cnt" id="cnt-all">0</span></button>
      <button class="chip" data-filter="検討中">検討中<span class="cnt" id="cnt-plan">0</span></button>
      <button class="chip" data-filter="申込済">申込済<span class="cnt" id="cnt-ordered">0</span></button>
      <button class="chip" data-filter="到着済">到着済<span class="cnt" id="cnt-arrived">0</span></button>
    </div>

    <div class="list" id="itemList"></div>

    <div class="section-title"><span>発送時期の内訳</span></div>
    <div class="list" id="shipSummary"></div>
  </main>
</div>

<!-- 品物編集モーダル -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">品物を追加</h2>
      <button type="button" class="close-btn" onclick="closeModal()">×</button>
    </div>
    <form id="modalForm">
      <input type="hidden" id="f_id" />
      <input type="hidden" id="f_existingReceiptData" />

      <div class="field"><label>品物 *</label>
        <input type="text" id="f_name" placeholder="例: いちご" required />
      </div>

      <div class="field-row">
        <div class="field"><label>金額（寄附額）</label>
          <input type="number" id="f_amount" min="0" step="1000" placeholder="未定なら空欄" />
        </div>
        <div class="field"><label>ステータス</label>
          <select id="f_status">
            <option value="検討中">検討中</option>
            <option value="申込済">申込済</option>
            <option value="到着済">到着済</option>
          </select>
        </div>
      </div>
      <div class="field-hint" id="f_remainHint"></div>

      <div class="field" style="margin-top:14px;"><label>発送時期</label>
        <input type="text" id="f_ship" placeholder="例: 2026/2 、2026/8-11" />
        <div class="field-hint">「2026/2」「2026/8-11」のように自由に入力できます。空欄は「未定」として扱われます。</div>
      </div>

      <label class="check-row">
        <input type="checkbox" id="f_onestop" />
        <span>ワンストップ特例の申請書を提出済<small>確定申告する場合はチェック不要です</small></span>
      </label>

      <div class="field"><label>画像（受領証明書・返礼品など／任意）</label>
        <input type="file" id="f_receipt" accept="image/*" />
        <div id="f_receiptPreview" class="image-preview hidden">
          <img id="f_receiptImg" alt="プレビュー" />
          <div style="margin-top:6px; text-align:right;">
            <button type="button" class="btn btn-danger" id="f_removeReceipt" style="padding:4px 10px; font-size:12px;">画像を削除</button>
          </div>
        </div>
      </div>

      <div class="field"><label>メモ</label>
        <textarea id="f_note" rows="2" placeholder="例: 自治体名、内容量など"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 画像表示モーダル -->
<div id="imageModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>画像</h2>
      <button type="button" class="close-btn" onclick="closeImageModal()">×</button>
    </div>
    <div style="max-height:70vh; overflow:auto; background: rgba(0,0,0,.3); padding:8px; border-radius:10px;">
      <img id="imageModalImg" style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:6px;" />
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeImageModal()">閉じる</button>
      <a id="imageDownloadLink" class="btn btn-primary" download style="text-decoration:none; text-align:center;">ダウンロード</a>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, addDoc, serverTimestamp, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Wel-fit管理アプリと同じFirebaseプロジェクトを共有（同じGoogleアカウントでログイン可）
const firebaseConfig = {
  apiKey: "AIzaSyCI2mhBCXeViCfsy-B7vo3VyEONqk1MWyg",
  authDomain: "wel-fit-management.firebaseapp.com",
  projectId: "wel-fit-management",
  storageBucket: "wel-fit-management.firebasestorage.app",
  messagingSenderId: "75123432379",
  appId: "1:75123432379:web:f606b61809ad728bfac29e"
};
const DEFAULT_LIMIT = 240000;
const IMAGE_MAX_EDGE = 1200;
const IMAGE_JPEG_QUALITY = 0.7;
const IMAGE_MAX_BYTES = 700 * 1024;
const STATUSES = ["検討中", "申込済", "到着済"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const state = {
  user: null,
  year: String(new Date().getFullYear()),
  items: [],
  limit: DEFAULT_LIMIT,
  filter: "all",
  pendingReceiptFile: null
};

const $ = id => document.getElementById(id);
const fmtYen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

// Wel-fitとは別のサブツリーに保存: users/{uid}/furusato/{year}/items/{itemId}
const yearDocRef = (uid, year) => doc(db, "users", uid, "furusato", year);
const itemsCol = (uid, year) => collection(db, "users", uid, "furusato", year, "items");

const normStatus = s => STATUSES.includes(s) ? s : "検討中";
const isFixed = r => normStatus(r.status) !== "検討中";

// 「2026/8-11」「2026年2月」などから並べ替え用のキー(YYYYMM)を作る。判定できなければ末尾へ
function shipSortKey(ship) {
  const m = String(ship || "").normalize("NFKC").match(/(\d{4})\s*[\/\-年.]\s*(\d{1,2})/);
  if (!m) return Number.MAX_SAFE_INTEGER;
  return Number(m[1]) * 100 + Number(m[2]);
}

function buildYearSelector() {
  const YEAR_MIN = 2022, YEAR_MAX = 2030;
  const cur = Number(state.year);
  if (!(cur >= YEAR_MIN && cur <= YEAR_MAX)) {
    state.year = String(Math.min(YEAR_MAX, Math.max(YEAR_MIN, new Date().getFullYear())));
  }
  const sel = $("yearSelect");
  const html = [];
  for (let y = YEAR_MAX; y >= YEAR_MIN; y--) {
    html.push(`<option value="${y}"${String(y) === state.year ? " selected" : ""}>${y}年</option>`);
  }
  sel.innerHTML = html.join("");
  sel.onchange = async () => { state.year = sel.value; await loadAll(); };
}

async function compressImageToDataUrl(file) {
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("読み込み失敗")); r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("画像失敗")); im.src = dataUrl; });
  let { width, height } = img;
  if (Math.max(width, height) > IMAGE_MAX_EDGE) {
    const s = IMAGE_MAX_EDGE / Math.max(width, height);
    width = Math.round(width * s); height = Math.round(height * s);
  }
  const cv = document.createElement("canvas");
  cv.width = width; cv.height = height;
  cv.getContext("2d").drawImage(img, 0, 0, width, height);
  let q = IMAGE_JPEG_QUALITY;
  let out = cv.toDataURL("image/jpeg", q);
  while (out.length > IMAGE_MAX_BYTES * 1.37 && q > 0.3) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
  return out;
}

async function loadAll() {
  if (!state.user) return;
  const uid = state.user.uid;
  try {
    const yearSnap = await getDoc(yearDocRef(uid, state.year));
    const yd = yearSnap.exists() ? yearSnap.data() : {};
    state.limit = Number.isFinite(yd.limit) ? yd.limit : DEFAULT_LIMIT;
    const snap = await getDocs(itemsCol(uid, state.year));
    state.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (err) {
    console.error("読み込み失敗:", err);
    alert("読み込み失敗: " + err.message);
  }
  $("limitInput").value = state.limit;
  render();
}

function sortedItems() {
  return [...state.items].sort((a, b) => {
    const ka = shipSortKey(a.ship), kb = shipSortKey(b.ship);
    if (ka !== kb) return ka - kb;
    return String(a.name || "").localeCompare(String(b.name || ""), "ja");
  });
}

function render() {
  renderStats();
  renderList();
  renderShipSummary();
}

function renderStats() {
  const used = state.items.filter(isFixed).reduce((s, r) => s + Number(r.amount || 0), 0);
  const plan = state.items.filter(r => !isFixed(r)).reduce((s, r) => s + Number(r.amount || 0), 0);
  const remain = state.limit - used;
  $("usedValue").textContent = fmtYen(used);
  $("remainValue").textContent = fmtYen(remain);
  $("remainCard").classList.toggle("negative", remain < 0);
  const pct = state.limit > 0 ? Math.min(100, (used / state.limit) * 100) : 0;
  const bar = $("usedBar");
  bar.style.width = pct + "%";
  bar.classList.toggle("over", remain < 0);

  $("planWrap").classList.toggle("hidden", plan <= 0);
  $("planRemainWrap").classList.toggle("hidden", plan <= 0);
  $("planValue").textContent = fmtYen(plan);
  $("planRemainValue").textContent = fmtYen(state.limit - used - plan);

  const counts = { all: state.items.length, "検討中": 0, "申込済": 0, "到着済": 0 };
  state.items.forEach(r => { counts[normStatus(r.status)]++; });
  $("cnt-all").textContent = counts.all;
  $("cnt-plan").textContent = counts["検討中"];
  $("cnt-ordered").textContent = counts["申込済"];
  $("cnt-arrived").textContent = counts["到着済"];
}

function statusClass(st) {
  return st === "申込済" ? "s-ordered" : st === "到着済" ? "s-arrived" : "";
}

function renderList() {
  const list = $("itemList");
  list.innerHTML = "";
  const rows = sortedItems().filter(r => state.filter === "all" || normStatus(r.status) === state.filter);
  if (!rows.length) {
    list.innerHTML = `<div class="empty">${state.items.length ? "該当する品物がありません" : "まだ品物が登録されていません"}</div>`;
    return;
  }
  for (const r of rows) {
    const st = normStatus(r.status);
    const amount = Number(r.amount || 0);
    const receipt = r.receiptData
      ? `<img class="receipt-thumb" src="${escapeHtml(r.receiptData)}" data-act="view" data-id="${r.id}" />`
      : `<div class="receipt-empty" title="画像なし">📄</div>`;
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="main">
        <div class="row1">
          <span class="name">${escapeHtml(r.name || "")}</span>
          ${amount > 0
            ? `<span class="amount">${fmtYen(amount)}</span>`
            : `<span class="amount undecided">金額未定</span>`}
        </div>
        <div class="row2">
          <button class="pill ${statusClass(st)}" data-act="status" data-id="${r.id}" title="クリックでステータス変更">
            <span class="dot"></span>${st}
          </button>
          <span class="ship ${r.ship ? "" : "none"}">🚚 ${escapeHtml(r.ship || "時期未定")}</span>
          ${st !== "検討中"
            ? `<button class="pill ${r.onestop ? "onestop-on" : ""}" data-act="onestop" data-id="${r.id}" title="ワンストップ特例の提出状況">
                 ${r.onestop ? "ワンストップ済" : "ワンストップ未"}
               </button>`
            : ""}
          ${r.note ? `<span class="note">${escapeHtml(r.note)}</span>` : ""}
        </div>
      </div>
      <div class="actions">
        ${receipt}
        <button class="icon-btn" data-act="edit" data-id="${r.id}" title="編集">✏️</button>
        <button class="icon-btn danger" data-act="del" data-id="${r.id}" title="削除">🗑</button>
      </div>`;
    list.appendChild(el);
  }
}

function renderShipSummary() {
  const body = $("shipSummary");
  body.innerHTML = "";
  const groups = new Map();
  for (const r of state.items) {
    if (!isFixed(r)) continue;
    const key = String(r.ship || "").trim() || "時期未定";
    if (!groups.has(key)) groups.set(key, { key, names: [], amount: 0 });
    const g = groups.get(key);
    g.names.push(r.name || "");
    g.amount += Number(r.amount || 0);
  }
  const rows = [...groups.values()].sort((a, b) => {
    const ka = shipSortKey(a.key), kb = shipSortKey(b.key);
    if (ka !== kb) return ka - kb;
    return a.key.localeCompare(b.key, "ja");
  });
  if (!rows.length) {
    body.innerHTML = `<div class="empty">申込済の品物が登録されると発送時期ごとに集計されます</div>`;
    return;
  }
  for (const g of rows) {
    const row = document.createElement("div");
    row.className = "ship-row";
    row.innerHTML = `
      <div class="m">${escapeHtml(g.key)}</div>
      <div class="names">${escapeHtml(g.names.join("、"))}</div>
      <div class="n">${g.names.length}件</div>
      <div class="amt">${g.amount ? fmtYen(g.amount) : "—"}</div>`;
    body.appendChild(row);
  }
}

// ===== モーダル =====
window.closeModal = () => $("modal").classList.remove("show");
window.closeImageModal = () => $("imageModal").classList.remove("show");

function openModal(row) {
  state.pendingReceiptFile = null;
  $("f_id").value = row ? row.id : "";
  $("modalTitle").textContent = row ? "品物を編集" : "品物を追加";
  $("f_name").value = row?.name || "";
  $("f_amount").value = row?.amount || "";
  $("f_status").value = normStatus(row?.status);
  $("f_ship").value = row?.ship || "";
  $("f_onestop").checked = row?.onestop === true;
  $("f_note").value = row?.note || "";
  $("f_receipt").value = "";
  $("f_existingReceiptData").value = row?.receiptData || "";
  if (row?.receiptData) {
    $("f_receiptImg").src = row.receiptData;
    $("f_receiptPreview").classList.remove("hidden");
  } else {
    $("f_receiptPreview").classList.add("hidden");
  }
  updateRemainHint();
  $("modal").classList.add("show");
}

// 編集中の行を除いた残り枠を表示（入力中の金額を反映）
function updateRemainHint() {
  const editingId = $("f_id").value;
  const others = state.items
    .filter(r => r.id !== editingId && isFixed(r))
    .reduce((s, r) => s + Number(r.amount || 0), 0);
  const entered = Number($("f_amount").value || 0);
  const counts = $("f_status").value !== "検討中";
  const after = state.limit - others - (counts ? entered : 0);
  const hint = $("f_remainHint");
  hint.innerHTML = `上限 ${fmtYen(state.limit)} ／ この内容を保存した場合の残り枠: <b style="color:${after < 0 ? "var(--bad)" : "var(--good)"}">${fmtYen(after)}</b>`
    + (counts ? "" : "<br />検討中は残り枠の計算に含まれません。");
}

async function saveModal(e) {
  e.preventDefault();
  if (!state.user) return;
  const saveBtn = $("saveBtn");
  saveBtn.disabled = true; saveBtn.textContent = "保存中…";
  try {
    const uid = state.user.uid;
    const id = $("f_id").value;
    const data = {
      name: $("f_name").value.trim(),
      amount: Number($("f_amount").value || 0),
      status: normStatus($("f_status").value),
      ship: $("f_ship").value.trim(),
      onestop: $("f_onestop").checked,
      note: $("f_note").value || "",
      updatedAt: serverTimestamp()
    };
    if (state.pendingReceiptFile) {
      saveBtn.textContent = "画像圧縮中…";
      data.receiptData = await compressImageToDataUrl(state.pendingReceiptFile);
    } else {
      data.receiptData = $("f_existingReceiptData").value || "";
    }
    saveBtn.textContent = "保存中…";
    await setDoc(yearDocRef(uid, state.year), { year: state.year }, { merge: true });
    if (id) {
      await setDoc(doc(itemsCol(uid, state.year), id), data, { merge: true });
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(itemsCol(uid, state.year), data);
    }
    closeModal();
    await loadAll();
  } catch (err) {
    console.error(err);
    alert("保存失敗: " + err.message);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = "保存";
  }
}

// 検討中 → 申込済 → 到着済 → 検討中 と巡回
async function cycleStatus(id) {
  const row = state.items.find(r => r.id === id);
  if (!row) return;
  const next = STATUSES[(STATUSES.indexOf(normStatus(row.status)) + 1) % STATUSES.length];
  row.status = next;
  render();
  try {
    await updateDoc(doc(itemsCol(state.user.uid, state.year), id), { status: next, updatedAt: serverTimestamp() });
  } catch (e) {
    alert("更新失敗: " + e.message);
    await loadAll();
  }
}

async function toggleOnestop(id) {
  const row = state.items.find(r => r.id === id);
  if (!row) return;
  const next = !(row.onestop === true);
  row.onestop = next;
  render();
  try {
    await updateDoc(doc(itemsCol(state.user.uid, state.year), id), { onestop: next, updatedAt: serverTimestamp() });
  } catch (e) {
    alert("更新失敗: " + e.message);
    await loadAll();
  }
}

async function deleteRow(id) {
  const row = state.items.find(r => r.id === id);
  if (!confirm(`「${row?.name || ""}」を削除しますか？`)) return;
  await deleteDoc(doc(itemsCol(state.user.uid, state.year), id));
  await loadAll();
}

function openImageView(url) {
  $("imageModalImg").src = url;
  $("imageDownloadLink").href = url;
  $("imageModal").classList.add("show");
}

async function saveLimit() {
  if (!state.user) return;
  const input = $("limitInput");
  const val = Number(input.value);
  if (!Number.isFinite(val) || val < 0) { input.value = state.limit; return; }
  state.limit = val;
  try {
    await setDoc(yearDocRef(state.user.uid, state.year), { year: state.year, limit: val }, { merge: true });
    render();
  } catch (e) {
    alert("上限額の保存失敗: " + e.message);
  }
}

function bindEvents() {
  const login = () => signInWithPopup(auth, provider).catch(err => alert("ログイン失敗: " + err.message));
  $("loginBtn").onclick = login;
  $("loginBtn2").onclick = login;
  $("logoutBtn").onclick = () => signOut(auth);
  $("addItem").onclick = () => openModal(null);
  $("modalForm").onsubmit = saveModal;

  $("limitInput").addEventListener("change", saveLimit);
  $("limitInput").addEventListener("blur", saveLimit);
  $("f_amount").addEventListener("input", updateRemainHint);
  $("f_status").addEventListener("change", updateRemainHint);

  $("filters").addEventListener("click", e => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    state.filter = chip.dataset.filter;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
    renderList();
  });

  $("f_receipt").addEventListener("change", e => {
    const file = e.target.files[0]; if (!file) return;
    if (file.size > 20 * 1024 * 1024) { alert("画像が20MBを超えています"); e.target.value = ""; return; }
    state.pendingReceiptFile = file;
    const r = new FileReader();
    r.onload = ev => { $("f_receiptImg").src = ev.target.result; $("f_receiptPreview").classList.remove("hidden"); };
    r.readAsDataURL(file);
  });
  $("f_removeReceipt").onclick = () => {
    state.pendingReceiptFile = null;
    $("f_receipt").value = "";
    $("f_existingReceiptData").value = "";
    $("f_receiptPreview").classList.add("hidden");
  };

  document.body.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const { act, id } = btn.dataset;
    const row = state.items.find(r => r.id === id);
    if (act === "view") { if (row?.receiptData) openImageView(row.receiptData); return; }
    if (act === "status") { cycleStatus(id); return; }
    if (act === "onestop") { toggleOnestop(id); return; }
    if (act === "edit") { openModal(row); return; }
    if (act === "del") { deleteRow(id); return; }
  });
  window.addEventListener("click", e => {
    if (e.target.id === "modal") closeModal();
    if (e.target.id === "imageModal") closeImageModal();
  });
}

onAuthStateChanged(auth, async user => {
  state.user = user;
  if (user) {
    const name = user.displayName || user.email || "?";
    $("userName").textContent = name;
    $("userAvatar").textContent = (name[0] || "?").toUpperCase();
    $("userChip").classList.remove("hidden");
    $("loginBtn").classList.add("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("signinNotice").classList.add("hidden");
    $("appBody").classList.remove("hidden");
    await loadAll();
  } else {
    $("userChip").classList.add("hidden");
    $("loginBtn").classList.remove("hidden");
    $("logoutBtn").classList.add("hidden");
    $("signinNotice").classList.remove("hidden");
    $("appBody").classList.add("hidden");
  }
});

buildYearSelector();
bindEvents();
$("limitInput").value = state.limit;
</script>
</body>
</html>
